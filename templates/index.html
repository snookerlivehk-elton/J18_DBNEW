<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>賽事查詢</title>
    <style>
        /* 基礎重置與 iOS 風格背景 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F2F2F7;
            margin: 0;
            padding: 16px;
            color: #000;
        }
        /* 主容器：限制最大寬度以適應不同螢幕 */
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        /* 標題 */
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 24px;
        }
        /* 搜尋卡片 (大圓角與陰影) */
        .search-card {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        /* 日期輸入框 */
        input[type="date"] {
            flex: 1;
            border: none;
            background: #F2F2F7;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }
        /* 查詢按鈕 (iOS 藍色) */
        button {
            background: #007AFF;
            color: #FFF;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.7;
        }
        /* 同步按鈕 (iOS 綠色) */
        .btn-sync {
            background: #34C759;
        }
        /* 賽事卡片 */
        .race-card {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .race-header {
            border-bottom: 1px solid #E5E5EA;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .race-title {
            font-size: 20px;
            font-weight: 600;
            color: #000;
            margin: 0 0 4px 0;
        }
        .race-meta {
            font-size: 14px;
            color: #8E8E93;
        }
        /* 馬匹列表 */
        .horse-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .horse-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #F2F2F7;
            border-radius: 12px;
        }
        .horse-rank {
            width: 32px;
            height: 32px;
            background: #FFFFFF;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin-right: 12px;
            color: #000;
            flex-shrink: 0;
        }
        /* 第一名以紅色突出 (iOS 紅色) */
        .rank-1 { color: #FF3B30; }
        
        .horse-info {
            flex: 1;
            min-width: 0; /* 防止文字溢出 */
        }
        .horse-name {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 2px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .horse-detail {
            font-size: 13px;
            color: #8E8E93;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .horse-odds {
            text-align: right;
            flex-shrink: 0;
            margin-left: 12px;
        }
        .odds-win {
            font-size: 15px;
            font-weight: 600;
            color: #007AFF;
        }
        .odds-pla {
            font-size: 13px;
            color: #8E8E93;
        }
        /* 提示訊息狀態 */
        .error {
            color: #FF3B30;
            text-align: center;
            padding: 20px;
        }
        .loading {
            text-align: center;
            color: #8E8E93;
            padding: 20px;
        }
        
        /* 批量同步卡片 */
        .batch-sync-card {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-bottom: 24px;
        }
        .batch-sync-title {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 12px 0;
            color: #000;
        }
        .batch-sync-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .date-divider {
            color: #8E8E93;
            font-weight: 600;
        }
        /* 按鈕紫色 (批量) */
        .btn-purple {
            background: #AF52DE;
        }
        
        /* 手機端自適應微調 */
        @media (max-width: 480px) {
            .search-card, .batch-sync-row {
                flex-direction: column;
                align-items: stretch;
            }
            .date-divider {
                text-align: center;
            }
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>賽事查詢與同步</h1>
        
        <!-- 同步狀態顯示卡片 (最上方) -->
        <div class="sync-status-card" style="background: #FFFFFF; padding: 16px 20px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.05);">
            <h3 style="margin: 0 0 12px 0; font-size: 16px; color: #000;">📊 資料庫同步狀態</h3>
            <div id="syncStatusContent" style="color: #8E8E93; font-size: 14px;">載入中...</div>
        </div>

        <!-- 單日查詢與同步 -->
        <div class="search-card">
            <input type="date" id="dateInput" value="2026-07-15">
            <button onclick="fetchData()">查詢 (即時API)</button>
            <button class="btn-sync" onclick="syncData()">單日同步至資料庫</button>
        </div>

        <!-- 批量區間同步 -->
        <div class="batch-sync-card">
            <h2 class="batch-sync-title">指定期間段的數據同步至資料庫</h2>
            <div class="batch-sync-row">
                <input type="date" id="startDate" value="2025-09-07">
                <span class="date-divider">至</span>
                <input type="date" id="endDate">
                <button class="btn-purple" onclick="backfillData()">開始批量同步</button>
            </div>
            <div id="batchResults" style="margin-top: 12px; font-size: 14px;"></div>
        </div>

        <div id="results"></div>
    </div>

    <script>
        // 頁面加載時立即獲取同步狀態
        window.onload = function() {
            loadSyncStatus();
            
            // 自動帶入今天日期作為結束日期
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('endDate').value = today;
        }

        // 取得同步狀態並渲染
        async function loadSyncStatus() {
            const statusDiv = document.getElementById('syncStatusContent');
            try {
                const resp = await fetch('/api/sync_status');
                const json = await resp.json();
                if (json.code === 0) {
                    const s = json.data;
                    const earliest = s.earliest_date || '<span style="color:#FF9500">尚未同步</span>';
                    const latest = s.latest_date || '<span style="color:#FF9500">尚未同步</span>';
                    statusDiv.innerHTML = `
                        <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
                            <div>
                                <span style="color: #8E8E93;">已同步起迄：</span>
                                <span style="font-weight: 600; color: #000;">${earliest}</span>
                                <span style="color: #8E8E93;"> 至 </span>
                                <span style="font-weight: 600; color: #000;">${latest}</span>
                            </div>
                            <div>
                                <span style="color: #007AFF;">共 ${s.unique_days_synced} 個比賽日</span> | 
                                <span style="color: #34C759;">${s.total_races} 場賽事</span> | 
                                <span style="color: #FF9500;">${s.total_horses} 匹馬紀錄</span>
                            </div>
                        </div>
                        <div style="font-size: 12px; margin-top: 8px; color: #8E8E93;">💡 建議：批量同步前請先確認上方起迄日期，避免重複同步。</div>
                    `;
                } else {
                    statusDiv.innerHTML = `<span style="color:#FF3B30">取得狀態失敗</span>`;
                }
            } catch (e) {
                statusDiv.innerHTML = `<span style="color:#FF3B30">無法連線伺服器取得狀態</span>`;
            }
        }

        // 獲取賽事資料並渲染到畫面上
        async function fetchData() {
            const date = document.getElementById('dateInput').value;
            const resultsDiv = document.getElementById('results');
            
            if (!date) {
                resultsDiv.innerHTML = '<div class="error">請選擇日期</div>';
                return;
            }

            resultsDiv.innerHTML = '<div class="loading">載入中...</div>';

            try {
                // 呼叫後端 API
                const response = await fetch(`/api/query?date=${date}`);
                const json = await response.json();

                if (json.code !== 0) {
                    resultsDiv.innerHTML = `<div class="error">查詢失敗：${json.msg}</div>`;
                    return;
                }

                const races = json.data;
                if (races.length === 0) {
                    resultsDiv.innerHTML = '<div class="loading">該日無賽事資料</div>';
                    return;
                }

                // 組合 HTML 字串渲染賽事卡片
                let html = '';
                for (const race of races) {
                    // 解析賽事派彩與分段時間 (完整顯示所有已提取 JSON)
                    let payoutHtml = '';
                    let timesHtml = '';
                    let extraDataHtml = [];
                    try {
                        const payout = typeof race.scene_result_payout === 'string' ? JSON.parse(race.scene_result_payout) : race.scene_result_payout;
                        if (payout && Object.keys(payout).length > 0) {
                            extraDataHtml.push(`<span style="color:#34C759;">✅ 派彩結果(scene_result_payout)</span>`);
                        }
                        
                        const times = typeof race.times === 'string' ? JSON.parse(race.times) : race.times;
                        if (times && times.length > 0) {
                            timesHtml = `<div style="font-size: 12px; color: #8E8E93; margin-top: 4px;">總分段時間: ${times.join(' | ')}</div>`;
                        }

                        const sectTimes = typeof race.sectional_times === 'string' ? JSON.parse(race.sectional_times) : race.sectional_times;
                        if (sectTimes && Object.keys(sectTimes).length > 0) extraDataHtml.push(`<span style="color:#34C759;">✅ 明細分段時間(sectional_times)</span>`);

                        const likeCount = typeof race.famous_like_count === 'string' ? JSON.parse(race.famous_like_count) : race.famous_like_count;
                        if (likeCount && Object.keys(likeCount).length > 0) extraDataHtml.push(`<span style="color:#34C759;">✅ 名家按讚(famous_like_count)</span>`);

                        const promote = typeof race.promote === 'string' ? JSON.parse(race.promote) : race.promote;
                        if (promote && Object.keys(promote).length > 0) extraDataHtml.push(`<span style="color:#34C759;">✅ 走勢推介(promote)</span>`);

                        const disc = typeof race.discount4 === 'string' ? JSON.parse(race.discount4) : race.discount4;
                        if (disc && Object.keys(disc).length > 0) extraDataHtml.push(`<span style="color:#34C759;">✅ 賠率折讓(discount4)</span>`);

                        if (extraDataHtml.length > 0) {
                            payoutHtml = `<div style="font-size: 11px; margin-top: 10px; display: flex; flex-wrap: wrap; gap: 12px; padding: 8px; background: #F2F2F7; border-radius: 8px;">${extraDataHtml.join('')}</div>`;
                        }
                    } catch(e) { console.error('Parse race json fields failed', e); }

                    html += `
                        <div class="race-card">
                            <div class="race-header">
                                <h2 class="race-title">第 ${race.race_num} 場: ${race.race_name || race.title}</h2>
                                <div class="race-meta">${race.race_class} | ${race.distance} | ${race.course} ${race.track} | ${race.ground}</div>
                                ${timesHtml}
                                ${payoutHtml}
                            </div>
                            <div class="horse-list">
                    `;
                    
                    // 遍歷該場次的所有馬匹
                    for (const horse of race.horses) {
                        const rankClass = horse.finish_order === '1' ? 'rank-1' : '';
                        
                        // 解析 sections 資料 (完整顯示排名+時間+距離)
                        let sectionsHtml = '';
                        if (horse.sections) {
                            try {
                                const sections = typeof horse.sections === 'string' ? JSON.parse(horse.sections) : horse.sections;
                                const stages = [];
                                for (let i = 1; i <= 6; i++) {
                                    const stage = sections[`stage_${i}`];
                                    if (stage) {
                                        const timeStr = stage.sectional_time ? `${stage.sectional_time}s` : '-';
                                        const distStr = stage.distance ? `距${stage.distance}` : '';
                                        const posStr = stage.position ? `排名${stage.position}` : '-';
                                        stages.push(`<span><b>第${i}段:</b> ${posStr} / ${timeStr} / ${distStr}</span>`);
                                    }
                                }
                                if (stages.length > 0) {
                                    sectionsHtml = `<div style="font-size: 12px; color: #007AFF; margin-top: 8px; padding: 8px; background-color: #F2F2F7; border-radius: 8px; display: flex; flex-direction: column; gap: 4px;">${stages.join('')}</div>`;
                                }
                            } catch(e) {
                                console.error('Parse sections failed', e);
                            }
                        }

                        html += `
                            <div class="horse-item">
                                <div class="horse-rank ${rankClass}">${horse.finish_order}</div>
                                <div class="horse-info">
                                    <p class="horse-name">${horse.horse_no}. ${horse.horse_name} <span style="font-size:12px;color:#8E8E93">(${horse.brandNum || '-'})</span></p>
                                    <p class="horse-detail">
                                        騎師: ${horse.jockey} | 練馬師: ${horse.trainer} | 完成時間: ${horse.final_time || '-'}<br>
                                        檔位: ${horse.barDraw || '-'} | 負磅: ${horse.handicapWeight || '-'} | 體重: ${horse.sceneWeight || '-'} (${horse.horseWeight || '-'})<br>
                                        配備: ${horse.gear || '-'} | 評分: ${horse.runnerRating || '-'} | 近六場: ${horse.lastSixRun || '-'}<br>
                                        年齡/性別: ${horse.age || '-'}/${horse.sex || '-'} | 進口類別: ${horse.importType || '-'}
                                        ${horse.scratched ? '<br><span style="color:#FF3B30; font-weight:bold">⚠️ 此馬匹已退出 (Scratched)</span>' : ''}
                                    </p>
                                    ${sectionsHtml}
                                </div>
                                <div class="horse-odds">
                                    <div class="odds-win">獨贏 ${horse.win_probability || '-'}</div>
                                    <div class="odds-pla">位置 ${horse.pla_probability || '-'}</div>
                                </div>
                            </div>
                        `;
                    }
                    
                    html += `
                            </div>
                        </div>
                    `;
                }
                resultsDiv.innerHTML = html;

            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">網路錯誤：${error.message}</div>`;
            }
        }
        
        // 呼叫後端 API 將資料同步至資料庫
        async function syncData() {
            const date = document.getElementById('dateInput').value;
            const resultsDiv = document.getElementById('results');
            
            if (!date) {
                alert('請先選擇日期');
                return;
            }

            resultsDiv.innerHTML = '<div class="loading">正在將資料寫入資料庫，請稍候...</div>';

            try {
                const response = await fetch(`/api/sync?date=${date}`);
                const json = await response.json();

                if (json.code !== 0) {
                    resultsDiv.innerHTML = `<div class="error">同步失敗：${json.msg}</div>`;
                } else {
                    resultsDiv.innerHTML = `<div class="loading" style="color: #34C759; font-weight: bold;">${json.msg}</div>`;
                }
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">網路錯誤：${error.message}</div>`;
            }
        }
        
        // 頁面載入時自動查詢預設日期
        window.onload = () => {
            // 預設結束日期為今天
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('endDate').value = today;
            
            fetchData();
        };

        // 呼叫後端 API 將區間資料批量同步至資料庫
        async function backfillData() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const batchResultsDiv = document.getElementById('batchResults');
            
            if (!startDate || !endDate) {
                alert('請選擇起始與結束日期');
                return;
            }

            batchResultsDiv.innerHTML = '<span style="color: #8E8E93;">正在執行區間批量同步，範圍較大時可能需要數分鐘，請耐心等候不要關閉視窗...</span>';

            try {
                const response = await fetch(`/api/backfill?start_date=${startDate}&end_date=${endDate}`);
                const json = await response.json();

                if (json.code !== 0) {
                    batchResultsDiv.innerHTML = `<span style="color: #FF3B30;">批量同步完成但有部分錯誤：${json.msg} (詳情請見伺服器 Log)</span>`;
                } else {
                    const s = json.data.summary;
                    batchResultsDiv.innerHTML = `
                        <span style="color: #AF52DE; font-weight: bold;">
                            ✅ ${json.msg}<br>
                            掃描天數: ${s.days_scanned} 天 | 
                            成功匯入: ${s.days_ok} 天 | 
                            無賽事跳過: ${s.days_skipped} 天<br>
                            總計寫入賽事: ${s.races_synced_total} 場
                        </span>
                    `;
                }
            } catch (error) {
                batchResultsDiv.innerHTML = `<span style="color: #FF3B30;">網路或超時錯誤：${error.message}</span>`;
            }
        }
    </script>
</body>
</html>
